# NeoXten Automation — Nemyo Extension (KidMode OFF)
# Validates extension does NOT redirect when kidMode is off.
# Use for smoke: extension loads, navigates, no unexpected redirects.

project:
  type: extension
  root: ../kidguard-extension
  extension:
    path: .
    storageSeed:
      nemyo_state_v1:
        kidMode: false
        ageBand: "6_8"

flows:
  - name: kidmode_off_no_redirect
    steps:
      - action: navigate
        url: "https://www.youtube.com/results?search_query=street+fight"
        timeout: 30000
      - action: wait
        timeout: 5000
      - action: evaluate
        expression: |
          (() => {
            const href = window.location.href;
            const params = new URLSearchParams(new URL(href).search);
            const q = (params.get('search_query') || '').replace(/\+/g, ' ');
            if (!q.includes('street') && !q.includes('fight')) throw new Error('Expected no redirect (query unchanged), got: ' + q);
          })()

assistant:
  enabled: false

gates:
  startupMaxMs: 45000
  noConsoleErrors: false

artifacts:
  traceOnFailure: true
  screenshotOnFailure: true
  screenshotFinal: true
  consoleLog: true
