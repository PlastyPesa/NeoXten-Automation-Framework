# NeoXten Automation — PlastyPesa Admin Dashboard
# Tests that admin dashboard pages load correctly.
# Requires: cd plastypesa-admin-dashboard/lib/frontend && npm run dev

project:
  type: nextjs
  root: ../plastypesa-admin-dashboard/lib/frontend
  nextjs:
    script: npm run dev
    url: http://localhost:8080

flows:
  # ── Public pages ──
  - name: landing_page_loads
    steps:
      - action: navigate
        url: http://localhost:8080/
        timeout: 15000
      - action: wait
        timeout: 3000
      - action: evaluate
        expression: |
          (() => {
            const body = (document.body.innerText || '').toLowerCase();
            if (!body.includes('recycle') && !body.includes('plastypesa') && !body.includes('plasty')) {
              throw new Error('Landing page did not render PlastyPesa content: ' + body.substring(0, 300));
            }
          })()

  - name: login_page_loads
    steps:
      - action: navigate
        url: http://localhost:8080/login
        timeout: 15000
      - action: wait
        timeout: 3000
      - action: assert
        type: visible
        selector: "input, form"
        timeout: 10000

  - name: collector_signup_loads
    steps:
      - action: navigate
        url: http://localhost:8080/collector-signup
        timeout: 15000
      - action: wait
        timeout: 3000
      - action: evaluate
        expression: |
          (() => {
            const body = (document.body.innerText || '').toLowerCase();
            if (!body.includes('collector') && !body.includes('store') && !body.includes('sign')) {
              throw new Error('Collector signup page did not render: ' + body.substring(0, 300));
            }
          })()

  - name: privacy_policy_loads
    steps:
      - action: navigate
        url: http://localhost:8080/privacy-policy
        timeout: 15000
      - action: wait
        timeout: 3000
      - action: evaluate
        expression: |
          (() => {
            const body = (document.body.innerText || '').toLowerCase();
            if (!body.includes('privacy') && !body.includes('policy')) {
              throw new Error('Privacy policy page did not render: ' + body.substring(0, 300));
            }
          })()

  - name: account_deletion_all_languages
    steps:
      - action: navigate
        url: http://localhost:8080/account-deletion
        timeout: 15000
      - action: wait
        timeout: 1000
      - action: evaluate
        expression: |
          (() => {
            const body = document.body.innerText || '';
            if (!body.includes('Delete your PlastyPesa account') ||
                !body.includes('support@plastypesa.com') ||
                !body.includes('up to 7 years') ||
                !body.includes('up to 90 days')) {
              throw new Error('English account-deletion contract is incomplete: ' + body.substring(0, 800));
            }
          })()
      - action: navigate
        url: http://localhost:8080/it/account-deletion
      - action: wait
        timeout: 750
      - action: evaluate
        expression: |
          (() => {
            const body = document.body.innerText || '';
            if (!body.includes('Elimina il tuo account PlastyPesa')) throw new Error('Italian account-deletion page did not render');
          })()
      - action: navigate
        url: http://localhost:8080/es/account-deletion
      - action: wait
        timeout: 750
      - action: evaluate
        expression: |
          (() => {
            const body = document.body.innerText || '';
            if (!body.includes('Elimina tu cuenta de PlastyPesa')) throw new Error('Spanish account-deletion page did not render');
          })()
      - action: navigate
        url: http://localhost:8080/de/account-deletion
      - action: wait
        timeout: 750
      - action: evaluate
        expression: |
          (() => {
            const body = document.body.innerText || '';
            if (!body.includes('Dein PlastyPesa-Konto löschen')) throw new Error('German account-deletion page did not render');
          })()
      - action: navigate
        url: http://localhost:8080/fr/account-deletion
      - action: wait
        timeout: 750
      - action: evaluate
        expression: |
          (() => {
            const body = document.body.innerText || '';
            if (!body.includes('Supprimer votre compte PlastyPesa')) throw new Error('French account-deletion page did not render');
          })()
      - action: navigate
        url: http://localhost:8080/pt/account-deletion
      - action: wait
        timeout: 750
      - action: evaluate
        expression: |
          (() => {
            const body = document.body.innerText || '';
            if (!body.includes('Eliminar a tua conta PlastyPesa')) throw new Error('Portuguese account-deletion page did not render');
          })()
      - action: navigate
        url: http://localhost:8080/ro/account-deletion
      - action: wait
        timeout: 750
      - action: evaluate
        expression: |
          (() => {
            const body = document.body.innerText || '';
            if (!body.includes('Șterge-ți contul PlastyPesa')) throw new Error('Romanian account-deletion page did not render');
          })()

  # ── Protected pages (should redirect to login or show auth gate) ──
  - name: dashboard_requires_auth
    steps:
      - action: navigate
        url: http://localhost:8080/dashboard
        timeout: 15000
      - action: wait
        timeout: 3000
      - action: evaluate
        expression: |
          (() => {
            const href = window.location.href;
            const body = (document.body.innerText || '').toLowerCase();
            const isLoginPage = href.includes('/login');
            const hasLoginForm =
              body.includes('sign in') ||
              body.includes('enter your credentials') ||
              body.includes('admin dashboard') ||
              body.includes('email');
            const hasDashboardMetrics =
              body.includes('plastic collected') ||
              body.includes('total users') ||
              body.includes('recent activity');
            if (hasDashboardMetrics) {
              throw new Error('Dashboard loaded without auth — should redirect to login');
            }
            if (!isLoginPage && !hasLoginForm) {
              throw new Error('Dashboard did not redirect to login or show an auth gate. Current URL: ' + href);
            }
          })()

  - name: account_deletion_visual_final
    steps:
      - action: navigate
        url: http://localhost:8080/ro/account-deletion
        timeout: 15000
      - action: wait
        timeout: 750
      - action: evaluate
        expression: |
          (() => {
            const body = document.body.innerText || '';
            if (!body.includes('Șterge-ți contul PlastyPesa') ||
                !body.includes('support@plastypesa.com')) {
              throw new Error('Final Romanian account-deletion proof did not render');
            }
          })()

assistant:
  enabled: false

gates:
  startupMaxMs: 60000
  noConsoleErrors: false

artifacts:
  traceOnFailure: true
  screenshotOnFailure: true
  screenshotFinal: true
  consoleLog: true
