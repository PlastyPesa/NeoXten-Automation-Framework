# NeoXten Automation — Nemyo API Validation
# Validates that all critical API endpoints respond correctly.
# Tests unauthenticated paths (expected error responses) to prove endpoints are live.
# Full auth-path testing requires Firebase tokens (manual / CI with service account).

project:
  type: nextjs
  root: ../kidguard-web
  nextjs:
    script: npm run dev
    url: http://localhost:3000

flows:
  # ── Pairing: create without auth → must return error, not crash ──
  - name: pairing_create_no_auth
    steps:
      - action: navigate
        url: http://localhost:3000/api/pairing/create
        timeout: 15000
      - action: wait
        timeout: 1000

  # ── Device register: missing code → must return error ──
  - name: device_register_missing_code
    steps:
      - action: navigate
        url: http://localhost:3000/api/devices/register
        timeout: 15000
      - action: wait
        timeout: 1000

  # ── Get subscription: no params → must return hasSubscription: false ──
  - name: subscription_check_empty
    steps:
      - action: navigate
        url: http://localhost:3000/api/get-subscription
        timeout: 15000
      - action: wait
        timeout: 1000

  # ── Device state: no auth → must return error ──
  - name: device_state_no_auth
    steps:
      - action: navigate
        url: http://localhost:3000/api/devices/state
        timeout: 15000
      - action: wait
        timeout: 1000

  # ── Commands: no auth → must return error ──
  - name: commands_create_no_auth
    steps:
      - action: navigate
        url: http://localhost:3000/api/devices/commands/create
        timeout: 15000
      - action: wait
        timeout: 1000

  # ── Threat feed JSON: public endpoint ──
  - name: threat_feed_json
    steps:
      - action: navigate
        url: http://localhost:3000/api/threat-feed-json
        timeout: 15000
      - action: wait
        timeout: 1000

  # ── Check content: public endpoint ──
  - name: check_content_endpoint
    steps:
      - action: navigate
        url: http://localhost:3000/api/check-content
        timeout: 15000
      - action: wait
        timeout: 1000

  # ── Device ack: missing params returns friendly response ──
  - name: device_ack_missing_params
    steps:
      - action: navigate
        url: http://localhost:3000
        timeout: 15000
      - action: evaluate
        expression: |
          (async () => {
            const r = await fetch('http://localhost:3000/api/devices/ack', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
            const j = await r.json();
            if (r.status !== 200) throw new Error('Expected 200, got ' + r.status);
            if (j.ok !== false) throw new Error('Expected ok:false for missing params, got: ' + JSON.stringify(j));
          })()

  # ── Manage subscription: no auth returns 401 ──
  - name: manage_subscription_no_auth
    steps:
      - action: navigate
        url: http://localhost:3000
        timeout: 15000
      - action: evaluate
        expression: |
          (async () => {
            const r = await fetch('http://localhost:3000/api/manage-subscription', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
            if (r.status !== 401) throw new Error('Expected 401, got ' + r.status);
          })()

assistant:
  enabled: false

gates:
  startupMaxMs: 60000
  noConsoleErrors: false

artifacts:
  traceOnFailure: true
  screenshotOnFailure: true
  screenshotFinal: true
  consoleLog: true
